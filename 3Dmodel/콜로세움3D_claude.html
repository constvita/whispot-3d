<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>콜로세움 지도 모형</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D stage. Left rail = name + viewpoints + toggles; right = spot card; bottom-center = bout timeline. Whispot navy/cream/amber UI over a daylight diorama. */
:root{
  --navy:#0f1a2c;
  --panel:rgba(14,24,41,.86);
  --cream:#f3e9d6;
  --cream-dim:#b9b09f;
  --amber:#e6a53c;
  --amber-ink:#2a1a05;
  --line:rgba(243,233,214,.15);
  --stage:#d6cdbd;
  --f-display:"Gowun Batang","Noto Serif KR","AppleMyungjo",serif;
  --f-latin:"Cinzel","Trajan Pro","Times New Roman",serif;
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--cream);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#map{position:absolute;inset:0}
.mapboxgl-ctrl-bottom-right,.mapboxgl-ctrl-bottom-left{z-index:1}
#pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 12px 32px rgba(12,16,24,.22)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.rail{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));width:248px;display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 40px);overflow:auto;scrollbar-width:none}
.brand{padding:16px 18px 15px;position:relative}
.eyebrow{font-family:var(--f-latin);font-weight:600;letter-spacing:.2em;font-size:10px;color:var(--amber);margin:0 0 7px}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.1;margin:0;letter-spacing:-.01em}
.sub{margin:7px 0 0;color:var(--cream-dim);font-size:12.5px;line-height:1.5}
#infoBtn{display:none}

.dock{padding:8px;display:flex;flex-direction:column;gap:8px}
.views{display:flex;flex-direction:column;gap:2px}
.vbtn{appearance:none;border:0;background:transparent;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 11px;border-radius:8px;cursor:pointer;font-size:14px;text-align:left}
.vbtn small{font-family:var(--f-latin);font-size:9.5px;letter-spacing:.14em;color:var(--cream-dim)}
.vbtn:hover{background:rgba(243,233,214,.07)}
.vbtn[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink);font-weight:600}
.vbtn[aria-pressed="true"] small{color:rgba(42,26,5,.7)}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 4px 4px;border-top:1px solid var(--line)}
.tg{appearance:none;background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.tg:hover{border-color:rgba(243,233,214,.35)}
.tg[aria-pressed="true"]{border-color:var(--amber);color:var(--amber);background:rgba(230,165,60,.08)}
.slider{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--cream-dim);padding:6px 6px 2px}
.slider input{flex:1;min-width:0;accent-color:var(--amber)}
.slider output{font-variant-numeric:tabular-nums;width:3.2em;text-align:right;color:var(--cream)}

#info{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));width:316px;z-index:2;padding:18px 20px 18px;max-height:calc(100% - 210px);overflow:auto}
.kicker{font-family:var(--f-latin);font-weight:600;letter-spacing:.2em;font-size:10px;color:var(--amber);margin:0}
#info h2{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.3;margin:6px 0 10px;text-wrap:balance}
#info p.body{line-height:1.75;color:#e7dcc8;margin:0;font-size:13.5px}
.facts{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.facts li{border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;font-variant-numeric:tabular-nums}
.close{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:none;place-items:center;color:var(--cream-dim)}
.close:hover{color:var(--cream);background:rgba(243,233,214,.08)}

.bout{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(600px,calc(100% - 32px));padding:14px 16px 10px}
.bout-row{display:flex;gap:13px;align-items:flex-start}
.play{appearance:none;flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;cursor:pointer}
.play svg{width:16px;height:16px;fill:currentColor}
.beat{min-width:0;flex:1}
.beat-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.beat-name{font-family:var(--f-display);font-weight:700;font-size:16.5px;margin:0}
.beat-time{font-variant-numeric:tabular-nums;color:var(--cream-dim);font-size:12px;white-space:nowrap}
.beat-text{margin:3px 0 0;color:#e2d7c3;line-height:1.55;font-size:13px;min-height:2.6em}
.tl{position:relative;height:24px;margin-top:8px;cursor:pointer;touch-action:none}
.tl-track{position:absolute;left:0;right:0;top:11px;height:3px;background:rgba(243,233,214,.16);border-radius:2px;overflow:hidden}
.tl-fill{position:absolute;inset:0;background:var(--amber);transform-origin:left center;transform:scaleX(0)}
.tl-tick{position:absolute;top:7px;width:1px;height:11px;background:rgba(243,233,214,.4)}
.tl-head{position:absolute;top:7px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--cream);box-shadow:0 0 0 3px rgba(230,165,60,.35)}

.pin{position:absolute;left:0;top:0;pointer-events:auto;appearance:none;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 7px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--cream);cursor:pointer;white-space:nowrap;will-change:transform}
.pin::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px rgba(230,165,60,.25)}
.pin::after{content:"";position:absolute;left:50%;bottom:-7px;width:1px;height:7px;background:rgba(243,233,214,.55)}
.pin:hover{border-color:var(--amber)}

#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--stage);color:#3b3226;font-family:var(--f-display);font-size:18px;transition:opacity .5s}
#loading.done{opacity:0;pointer-events:none}
#loading span{display:block;font-family:var(--f-latin);font-size:11px;letter-spacing:.24em;color:#8a6a2c;margin-bottom:8px;text-align:center}

@media (max-width:860px){
  .rail{display:contents}
  .brand{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));padding:10px 14px}
  .eyebrow{font-size:9px;margin-bottom:3px}
  h1{font-size:21px}
  .sub{display:none}
  #infoBtn{display:grid;position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;place-items:center;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:15px}
  #infoBtn[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
  .dock{position:fixed;left:16px;right:16px;bottom:calc(var(--bout-h,140px) + 44px + env(safe-area-inset-bottom,0px));padding:6px;gap:6px}
  .views{flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:4px}
  .views::-webkit-scrollbar,.toggles::-webkit-scrollbar{display:none}
  .vbtn{white-space:nowrap;padding:7px 12px;font-size:13px}
  .vbtn small{display:none}
  .toggles{display:flex;overflow-x:auto;scrollbar-width:none;padding:6px 2px 2px;align-items:center}
  .tg{padding:6px 11px;font-size:12px;flex:none}
  .slider{flex:none;min-width:190px;padding:0 6px}
  #info{left:16px;right:16px;width:auto;top:calc(76px + env(safe-area-inset-top,0px));max-height:34%;padding:14px 44px 14px 16px}
  .close{display:grid}
  #info h2{font-size:18px;margin:4px 0 6px}
  #info p.body{font-size:13px;line-height:1.65}
  .facts{margin-top:10px}
  .bout{padding:11px 12px 8px;bottom:calc(36px + env(safe-area-inset-bottom,0px))}
  .beat-text{font-size:12.5px;min-height:0}
  .play{width:34px;height:34px}
}
@media (prefers-reduced-motion:reduce){#loading{transition:none}}
</style>

</head>
<body>
<div id="stage"><div id="map" aria-label="로마 지도 위 콜로세움 3D 모형. 드래그로 이동, 오른쪽 드래그나 두 손가락으로 회전·기울이기, 스크롤로 확대해요."></div><div id="pins"></div></div>

<div class="rail">
  <header class="brand panel">
    <p class="eyebrow">AMPHITHEATRVM FLAVIVM</p>
    <h1>콜로세움</h1>
    <p class="sub">로마 실제 위치 · 1세기 말 복원 모형</p>
    <button id="infoBtn" aria-pressed="false" aria-label="설명 보기">i</button>
  </header>
  <nav class="dock panel" aria-label="보기 설정">
    <div class="views" id="views"></div>
    <div class="toggles">
      <button class="tg" id="tgCut" aria-pressed="false">단면 보기</button>
      <button class="tg" id="tgPins" aria-pressed="true">스팟 표시</button>
      <button class="tg" id="tgCity" aria-pressed="true">주변 3D 건물</button>
      <button class="tg" id="tgSpin" aria-pressed="false">천천히 회전</button>
      <label class="slider" for="velum">차양막 <input type="range" id="velum" min="0" max="100" value="45"><output id="velumOut">45%</output></label>
    </div>
  </nav>
</div>

<aside id="info" class="panel" aria-live="polite">
  <button class="close" id="infoClose" aria-label="설명 닫기"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  <p class="kicker" id="infoKicker"></p>
  <h2 id="infoTitle"></h2>
  <p class="body" id="infoBody"></p>
  <ul class="facts" id="infoFacts"></ul>
</aside>

<section class="bout panel" id="bout" aria-label="검투 경기 진행">
  <div class="bout-row">
    <button class="play" id="play" aria-label="일시정지"><svg viewBox="0 0 16 16" id="playIcon"><rect x="3" y="2" width="3.6" height="12" rx="1"/><rect x="9.4" y="2" width="3.6" height="12" rx="1"/></svg></button>
    <div class="beat">
      <div class="beat-top"><p class="beat-name" id="beatName">탐색전</p><span class="beat-time" id="beatTime">0:00 / 0:30</span></div>
      <p class="beat-text" id="beatText"></p>
    </div>
  </div>
  <div class="tl" id="tl" role="slider" aria-label="경기 장면 이동" aria-valuemin="0" aria-valuemax="30" aria-valuenow="0" tabindex="0">
    <div class="tl-track"><div class="tl-fill" id="tlFill"></div></div>
    <div class="tl-head" id="tlHead"></div>
  </div>
</section>

<div id="loading"><div><span>AMPHITHEATRVM FLAVIVM</span>로마 지도를 불러오는 중…</div></div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
(function(){
'use strict';
const loadingEl=document.getElementById('loading');
function fail(msg){ loadingEl.classList.remove('done'); loadingEl.innerHTML='<div style="max-width:320px;text-align:center;line-height:1.6">'+msg+'</div>'; }
if(!window.THREE||!window.mapboxgl){ fail('지도나 3D 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인한 뒤 새로고침해 주세요.'); return; }
try{ main(); }catch(e){ console.error(e); fail('이 기기에서는 3D 모형을 띄우지 못했어요. WebGL을 지원하는 브라우저에서 다시 열어 주세요.'); }

function main(){
THREE.ColorManagement.legacyMode=false;
const TAU=Math.PI*2, HERO=1.6, A0=41.5, B0=24, LOOP=30;
const FD_IN=52.0, FD_OUT=53.5, FD_MID=52.75, NB=80;
const $=s=>document.querySelector(s);
const small=Math.min(innerWidth,innerHeight)<620;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rnd=mulberry32(20260802);
const V3=THREE.Vector3;

/* ---------- scene (rendered inside Mapbox as a custom layer) ---------- */
let renderer=null;
const scene=new THREE.Scene();
const camera=new THREE.Camera();
function canvasTex(w,h,draw,srgb=true){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);if(srgb)t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;}
scene.add(new THREE.HemisphereLight(0xe8eef6,0x9a8468,0.78));
scene.add(new THREE.AmbientLight(0xffffff,0.12));
const sun=new THREE.DirectionalLight(0xfff2dc,1.25);
sun.position.set(60,150,95);sun.castShadow=true;
const SM=small?1536:2048;sun.shadow.mapSize.set(SM,SM);
Object.assign(sun.shadow.camera,{left:-118,right:118,top:118,bottom:-118,near:20,far:420});
sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.06;
scene.add(sun);scene.add(sun.target);

/* ---------- helpers ---------- */
const CLIP_PLANE=new THREE.Plane(new V3(0,0,1),1e5);const CLIP=[CLIP_PLANE];
function clipM(m){m.clippingPlanes=CLIP;m.clipShadows=true;return m;}
const MATS={};
function M(hex,o){const k=hex+(o?JSON.stringify(o):'');if(!MATS[k])MATS[k]=new THREE.MeshStandardMaterial(Object.assign({color:new THREE.Color(hex),roughness:0.78,metalness:0},o||{}));return MATS[k];}
const metal=hex=>M(hex,{metalness:0.3,roughness:0.42});
function stdC(hex,o){return clipM(new THREE.MeshStandardMaterial(Object.assign({color:new THREE.Color(hex),roughness:0.86},o||{})));}
function grp(parent,pos,order){const g=new THREE.Group();if(pos)g.position.set(pos[0],pos[1],pos[2]);if(order)g.rotation.order=order;parent.add(g);return g;}
function mesh(geo,mat,parent,pos,rot,scl){const m=new THREE.Mesh(geo,mat);if(pos)m.position.set(pos[0],pos[1],pos[2]);if(rot)m.rotation.set(rot[0],rot[1],rot[2]);if(scl)m.scale.set(scl[0],scl[1],scl[2]);m.castShadow=true;m.receiveShadow=true;if(parent)parent.add(m);return m;}
const GC={};function cg(key,fn){return GC[key]||(GC[key]=fn());}
const box=(x,y,z)=>cg('b'+x+'_'+y+'_'+z,()=>new THREE.BoxGeometry(x,y,z));
const cyl=(a,b,h,s=10)=>cg('c'+a+'_'+b+'_'+h+'_'+s,()=>new THREE.CylinderGeometry(a,b,h,s));
const sph=(r,w=12,h=10)=>cg('s'+r+'_'+w+'_'+h,()=>new THREE.SphereGeometry(r,w,h));
function merge(geos){let n=0;const gs=geos.map(g=>{const x=g.index?g.toNonIndexed():g;n+=x.attributes.position.count;return x;});const pos=new Float32Array(n*3),nor=new Float32Array(n*3);let o=0;for(const g of gs){pos.set(g.attributes.position.array,o*3);nor.set(g.attributes.normal.array,o*3);o+=g.attributes.position.count;}const m=new THREE.BufferGeometry();m.setAttribute('position',new THREE.BufferAttribute(pos,3));m.setAttribute('normal',new THREE.BufferAttribute(nor,3));return m;}
const T=(g,x,y,z)=>g.clone().translate(x,y,z);

/* ---------- ellipse geometry (x = major axis E–W, z = minor axis, +z = south) ---------- */
function nrm(t){const x=B0*Math.cos(t),z=A0*Math.sin(t),l=Math.hypot(x,z);return[x/l,z/l];}
function P(t,d){const n=nrm(t);return[A0*Math.cos(t)+d*n[0],B0*Math.sin(t)+d*n[1]];}
function arcTable(d,N){const ts=new Float32Array(N+1),ss=new Float32Array(N+1);let s=0,prev=P(0,d);for(let i=1;i<=N;i++){const t=i/N*TAU,p=P(t,d);s+=Math.hypot(p[0]-prev[0],p[1]-prev[1]);ts[i]=t;ss[i]=s;prev=p;}return{ts,ss,L:s};}
function tAt(tab,s){s=((s%tab.L)+tab.L)%tab.L;let lo=0,hi=tab.ss.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(tab.ss[m]<s)lo=m;else hi=m;}const f=(s-tab.ss[lo])/((tab.ss[hi]-tab.ss[lo])||1);return tab.ts[lo]+f*(tab.ts[hi]-tab.ts[lo]);}
function sAt(tab,t){t=((t%TAU)+TAU)%TAU;let lo=0,hi=tab.ts.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(tab.ts[m]<t)lo=m;else hi=m;}const f=(t-tab.ts[lo])/((tab.ts[hi]-tab.ts[lo])||1);return tab.ss[lo]+f*(tab.ss[hi]-tab.ss[lo]);}
const yawOut=t=>{const n=nrm(t);return Math.atan2(n[0],n[1]);};
const yawIn=t=>{const n=nrm(t);return Math.atan2(-n[0],-n[1]);};

const COL={tread:'#ece4d2',riser:'#d1c3a7',wall:'#c7b291',terrace:'#e3d8c2',podium:'#efe6d4',mass:'#b8a07f',hole:'#857260',wood:'#a8784d',woodR:'#85603e',trav:'#d8cdb9',travD:'#bfb29a',poche:'#a4523d',marble:'#efe9dc',sand:'#e3c995',brick:'#9d6448'};
const SEG=small?150:200;

function sweep(loops,seg){
  const TT=[];for(let j=0;j<=seg;j++){const t=j/seg*TAU,n=nrm(t);TT.push([A0*Math.cos(t),B0*Math.sin(t),n[0],n[1]]);}
  const pos=[],nor=[],col=[],c=new THREE.Color();
  const V=(tt,p)=>[tt[0]+p[0]*tt[2],p[1],tt[1]+p[0]*tt[3]];
  for(const L of loops){
    const pts=L.pts,n=pts.length;let area=0;
    for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];area+=a[0]*b[1]-b[0]*a[1];}
    const sg=(area>0?1:-1)*(L.hole?-1:1);
    for(let i=0;i<n;i++){
      const a=pts[i],b=pts[(i+1)%n],dd=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dd,dy);if(len<1e-6)continue;
      const nd=sg*dy/len,ny=-sg*dd/len;
      c.set(COL[L.cols?L.cols[i]:L.color]||L.color);
      const A=V(TT[0],a),B=V(TT[1],a),C=V(TT[1],b);
      const e1=[B[0]-A[0],B[1]-A[1],B[2]-A[2]],e2=[C[0]-A[0],C[1]-A[1],C[2]-A[2]];
      const cr=[e1[1]*e2[2]-e1[2]*e2[1],e1[2]*e2[0]-e1[0]*e2[2],e1[0]*e2[1]-e1[1]*e2[0]];
      const flip=(cr[0]*nd*TT[0][2]+cr[1]*ny+cr[2]*nd*TT[0][3])<0;
      for(let j=0;j<seg;j++){
        const t0=TT[j],t1=TT[j+1];
        const v00=V(t0,a),v10=V(t1,a),v11=V(t1,b),v01=V(t0,b);
        const n0=[nd*t0[2],ny,nd*t0[3]],n1=[nd*t1[2],ny,nd*t1[3]];
        const q=flip?[v00,n0,v11,n1,v10,n1,v00,n0,v01,n0,v11,n1]:[v00,n0,v10,n1,v11,n1,v00,n0,v11,n1,v01,n0];
        for(let k=0;k<12;k+=2){pos.push(q[k][0],q[k][1],q[k][2]);nor.push(q[k+1][0],q[k+1][1],q[k+1][2]);col.push(c.r,c.g,c.b);}
      }
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));

  applyFig(THR,blend(poseAt(PT.thr,tw),POSES.thr_stand,w),tx,wz,lerpAng(-Math.PI/2,yawTo(tx,wz,watchX,watchZ),w),dt);
  // band
  const tp=num(TR.tuba,t);
  applyFig(TUB,blend(POSES.tuba_rest,POSES.tuba_play,tp),13.4,16.4,yawTo(13.4,16.4,0,6),dt);
  applyFig(COR,blend(POSES.cornu_rest,POSES.cornu_play,tp),15.3,15.6,yawTo(15.3,15.6,0,6),dt);

}

function camOptions(pos,tgt){const c=toMerc(pos),t=toMerc(tgt);const ca=Math.max(2,c.toAltitude()),ta=t.toAltitude();
 let dx=t.x-c.x,dy=t.y-c.y;const hm=Math.hypot(dx,dy)/mScale;dx/=(hm*mScale)||1;dy/=(hm*mScale)||1;
 let pitch=Math.atan2(hm,Math.max(0.01,ca-ta))*180/Math.PI;pitch=Math.min(84,Math.max(0,pitch));const pr=pitch*Math.PI/180;
 const g=ca*Math.tan(pr)*mScale;const center=new mapboxgl.MercatorCoordinate(c.x+dx*g,c.y+dy*g,0).toLngLat();
 const D=ca/Math.cos(pr);const H=$('#map').clientHeight||800;const zoom=Math.log2(1.5*H*Math.cos(center.lat*Math.PI/180)*40075016.686/(512*D));
 return{center,zoom:Math.min(22,Math.max(13,zoom)),pitch,bearing:Math.atan2(dx,-dy)*180/Math.PI};}

playBtn.addEventListener('click',()=>setPlaying(!playing));
const tl=$('#tl'),tlFill=$('#tlFill'),tlHead=$('#tlHead');
BEATS.forEach(b=>{if(!b[0])return;const d=document.createElement('div');d.className='tl-tick';d.style.left=(b[0]/LOOP*100)+'%';d.title=b[1];tl.appendChild(d);});
function seek(x){const r=tl.getBoundingClientRect();const k=Math.min(0.999,Math.max(0,(x-r.left)/r.width));simT=Math.floor(simT/LOOP)*LOOP+k*LOOP;lt=k*LOOP;prevLT=lt;}
let dragging=false;tl.addEventListener('pointerdown',e=>{dragging=true;tl.setPointerCapture(e.pointerId);seek(e.clientX);});tl.addEventListener('pointermove',e=>{if(dragging)seek(e.clientX);});tl.addEventListener('pointerup',()=>dragging=false);
tl.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const dlt=e.key==='ArrowRight'?1:-1;simT=Math.max(0,simT+dlt);prevLT=lt=simT%LOOP;e.preventDefault();}});
let beatIdx=-1;const beatName=$('#beatName'),beatText=$('#beatText'),beatTime=$('#beatTime');
function updateHUD(){let i=0;while(i<BEATS.length-1&&BEATS[i+1][0]<=lt)i++;if(i!==beatIdx){beatIdx=i;beatName.textContent=BEATS[i][1];beatText.textContent=BEATS[i][2];}
 const k=lt/LOOP;tlFill.style.transform=`scaleX(${k})`;tlHead.style.left=(k*100)+'%';const s=Math.floor(lt);beatTime.textContent=`0:${String(s).padStart(2,'0')} / 0:30`;tl.setAttribute('aria-valuenow',String(s));}
const bout=$('#bout');new ResizeObserver(()=>document.documentElement.style.setProperty('--bout-h',bout.offsetHeight+'px')).observe(bout);

/* ---------- Mapbox: Standard style, model at the real site ---------- */
// Colosseum centre and orientation: major axis azimuth 110.33° (WNW–ESE), imperial box on the SSW side.
const ORIGIN=[12.492222,41.890278],ROT=-(110.33-90)*Math.PI/180;
mapboxgl.accessToken='pk.eyJ1IjoiY29uc3R2aXRhIiwiYSI6Ilh0ZDRTaXcifQ.SybfmVv4h_JFuh6Jr8uIhQ';
const mc0=mapboxgl.MercatorCoordinate.fromLngLat(ORIGIN,0),mScale=mc0.meterInMercatorCoordinateUnits();
const L=new THREE.Matrix4().makeTranslation(mc0.x,mc0.y,mc0.z).scale(new V3(mScale,-mScale,mScale)).multiply(new THREE.Matrix4().makeRotationX(Math.PI/2)).multiply(new THREE.Matrix4().makeRotationY(ROT));
const Linv=L.clone().invert();
function toMerc(p){const v=(p.isVector3?p.clone():new V3(p[0],p[1],p[2])).applyMatrix4(L);return new mapboxgl.MercatorCoordinate(v.x,v.y,v.z);}
const map=new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/standard',center:ORIGIN,zoom:16.4,pitch:60,bearing:-20,projection:'mercator',maxPitch:85,antialias:true,
  config:{basemap:{lightPreset:'day',show3dLandmarks:false}},attributionControl:true,logoPosition:'bottom-left'});
if(!small)map.addControl(new mapboxgl.NavigationControl({visualizePitch:true}),'bottom-right');
map.on('error',e=>{const st=e&&e.error&&(e.error.status||0);if(st===401||st===403)fail('맵박스 토큰으로 지도를 불러오지 못했어요. 토큰의 허용 URL 설정에 이 파일을 여는 주소가 포함돼 있는지 확인해 주세요.');console.warn(e&&e.error);});
let last=performance.now(),first=true;const MVP=new THREE.Matrix4();
function frame(now,matrix){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(playing&&!dragging)simT+=dt;
  lt=simT%LOOP;
  if(playing&&!dragging){for(const e of EVENTS){const hit=lt>=prevLT?(e[0]>prevLT&&e[0]<=lt):(e[0]>prevLT||e[0]<=lt);if(hit)fire(e[1]);}}
  prevLT=lt;
  updateScene(lt,playing?dt:0);
  stepFx(playing?dt:0);
  MVP.fromArray(matrix).multiply(L);
  camera.projectionMatrix.copy(MVP);camera.projectionMatrixInverse.copy(MVP).invert();
  updatePins(MVP);updateHUD();
}
const colLayer={id:'colosseum-model',type:'custom',renderingMode:'3d',slot:'middle',
  onAdd(m,gl){renderer=new THREE.WebGLRenderer({canvas:m.getCanvas(),context:gl,antialias:true});renderer.autoClear=false;renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.localClippingEnabled=true;},
  render(gl,matrix){
    frame(performance.now(),matrix);
    renderer.resetState();
    renderer.setViewport(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight);
    renderer.render(scene,camera);
    if(first){first=false;loadingEl.classList.add('done');}
    map.triggerRepaint();
  }};
map.on('style.load',()=>{
  // clear trees and labels inside the footprint so they don't poke through the model
  const ring=[];for(let i=0;i<=96;i++){const p=P(i/96*TAU,58);const c=toMerc([p[0],0,p[1]]).toLngLat();ring.push([c.lng,c.lat]);}
  try{map.addSource('col-clip',{type:'geojson',data:{type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[ring]}}});
      map.addLayer({id:'col-clip',type:'clip',source:'col-clip',layout:{'clip-layer-types':['model','symbol'],'clip-layer-scope':['basemap']}});}catch(err){console.warn(err);}
  map.addLayer(colLayer);
  onVelum();setView('overview',true);if(isMobile())setInfoOpen(false);
});
(function spinLoop(){if(spin&&!map.isMoving())map.setBearing(map.getBearing()+0.06);requestAnimationFrame(spinLoop);})();

}
})();
</script>
